name: "Editor Config Checker"

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - develop

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: editorconfig-checker
        run: scripts/editorconfig-checker.bat
